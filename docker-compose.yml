# Stack: api (FastAPI) + db (PostGIS) + proxy (nginx).
# Avvio: cp backend/.env.example backend/.env && docker compose up --build

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-segnalazioni}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-segnalazioni}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # le foto delle segnalazioni persistono fuori dal container
      - media:/app/media
    expose:
      - "8000"
    ports:
      - "8000:8000"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  pgdata:
  media:
